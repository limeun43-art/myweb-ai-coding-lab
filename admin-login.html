<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 로그인 - Lim Eun-hye AI·코딩 교육 연구소</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-logo">
      <div class="logo-badge">LH</div>
      <span class="login-logo-text">Admin</span>
    </div>
    <p class="login-subtitle">관리자 계정으로 로그인하세요</p>

    <div class="login-error" id="login-error">
      <i class="fas fa-exclamation-circle"></i>
      <span id="login-error-msg"></span>
    </div>

    <form class="login-form" id="login-form">
      <div class="form-group">
        <label for="login-username">아이디</label>
        <input type="text" id="login-username" class="form-control" placeholder="관리자 아이디 입력" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="login-password">비밀번호</label>
        <input type="password" id="login-password" class="form-control" placeholder="비밀번호 입력" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
        <i class="fas fa-right-to-bracket"></i> 로그인
      </button>
    </form>

    <p class="login-footer">
      <a href="index.html" style="color: var(--primary-blue);">← 사이트로 돌아가기</a>
    </p>
  </div>

  <script type="module">
    import { AuthService } from './js/dataService.js';
    
    // 인증 상태 확인
    AuthService.onAuthStateChanged((user) => {
      if (user) {
        window.location.href = 'admin.html';
      }
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = e.target.querySelector('button');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 처리 중...';
      btn.disabled = true;

      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      const errorBox = document.getElementById('login-error');
      const errorMsg = document.getElementById('login-error-msg');

      errorBox.classList.remove('show');

      const result = await AuthService.login(username, password);
      
      // onAuthStateChanged에서 리다이렉트 처리되므로 성공 시에는 별도 동작 불필요
      if (!result.success) {
        errorMsg.textContent = result.message;
        errorBox.classList.add('show');
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
